<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ruijie Voucher System</title>
    <style>
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 20px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        h2 {
            text-align: center;
            color: #58a6ff;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            font-size: 14px;
            color: #8b949e;
            margin-bottom: 5px;
        }
        input, select {
            width: 100%;
            padding: 10px;
            background-color: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            color: #c9d1d9;
            font-size: 14px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #238636;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
        }
        .btn-gen {
            background-color: #1f6feb;
            margin-bottom: 15px;
        }
        button:hover {
            opacity: 0.9;
        }
        .console {
            background-color: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 10px;
            height: 120px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 12px;
            color: #3fb950;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>VOUCHER & PORTAL TOOL</h2>
        
        <!-- Voucher Generator Section -->
        <div class="form-group">
            <label>Voucher Duration (အချိန်)</label>
            <select id="durationSelect">
                <option value="1hour">1 Hour (၁ နာရီ)</option>
                <option value="3hour" selected>3 Hours (၃ နာရီ)</option>
            </select>
        </div>
        <button class="btn-gen" onclick="generateVoucher()">GENERATE NEW VOUCHER CODE</button>

        <div class="form-group">
            <label>Voucher Code</label>
            <input type="text" id="voucherCode" placeholder="ထုတ်ထားသော ကုဒ်ပေါ်လာပါမည်">
        </div>

        <div class="form-group">
            <label>Ruijie Portal Full URL</label>
            <input type="text" id="portalUrl" placeholder="https://portal-as.ruijienetworks.com/...">
        </div>

        <button onclick="useVoucher()">USE VOUCHER & CONNECT INTERNET</button>

        <div class="console" id="consoleLog">
            > System ready. Generate or enter voucher code...
        </div>
    </div>

    <script>
        function logMessage(msg) {
            const consoleBox = document.getElementById('consoleLog');
            consoleBox.innerHTML += `<br>> ${msg}`;
            consoleBox.scrollTop = consoleBox.scrollHeight;
        }

        function generateVoucher() {
            let duration = document.getElementById('durationSelect').value;
            fetch(`/api/generate-voucher?duration=${duration}`)
            .then(res => res.json())
            .then(data => {
                if(data.success) {
                    document.getElementById('voucherCode').value = data.voucherCode;
                    logMessage(`[✔] Generated: ${data.voucherCode} (${data.duration})`);
                }
            })
            .catch(err => logMessage(`[X] Error: ${err.message}`));
        }

        function useVoucher() {
            let portalUrl = document.getElementById('portalUrl').value;
            let voucherCode = document.getElementById('voucherCode').value;

            if(!portalUrl || !voucherCode) {
                logMessage("Error: Please provide both Portal URL and Voucher Code!");
                return;
            }

            logMessage("Authenticating voucher with gateway...");

            fetch('/api/use-voucher', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ portalUrl, voucherCode })
            })
            .then(res => res.json())
            .then(data => {
                if(data.success) {
                    logMessage(`[✔] ${data.message}`);
                } else {
                    logMessage(`[X] ${data.message}`);
                }
            })
            .catch(err => logMessage(`[X] Connection failed: ${err.message}`));
        }
    </script>

</body>
</html>
